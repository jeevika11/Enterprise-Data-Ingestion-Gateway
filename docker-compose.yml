
services:

  redis:
    image: redis:7.4-bookworm
    container_name: task15-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build: .
    container_name: task15-api
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    volumes:
      - prometheus_data:/tmp/prometheus
    depends_on:
      - redis
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: task15-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  prometheus_data:
